<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header / Navigation Bar -->
  <header class="header">
    <nav class="nav-links">
      <a href="https://mail.google.com" target="_blank" class="nav-item">Gmail</a>
      <a href="https://www.google.com/imghp" target="_blank" class="nav-item">Gambar</a>
      <button class="icon-btn app-drawer" title="Google Apps" aria-label="Google Apps">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="#5f6368">
          <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"></path>
        </svg>
      </button>
      <button class="signin-btn">Login</button>
    </nav>
  </header>

  <!-- Main Search Section -->
  <main class="main-content">
    <div class="logo-container">
      <!-- Google Logo SVG -->
      <svg class="google-logo" viewBox="0 0 272 92" width="272" height="92">
        <path fill="#4285F4" d="M115.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18C71.25 34.32 81.24 25 93.5 25s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44S80.99 39.2 80.99 47.18c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"/>
        <path fill="#EA4335" d="M163.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18c0-12.85 9.99-22.18 22.25-22.18s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44s-12.51 5.46-12.51 13.44c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"/>
        <path fill="#4285F4" d="M209.75 26.34v39.82c0 16.38-9.66 23.07-21.08 23.07-10.75 0-17.22-7.19-19.66-13.07l8.48-3.53c1.51 3.61 5.21 8.16 11.18 8.16 7.31 0 11.84-4.53 11.84-13.07v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-3.87h9.44zm-8.82 21.01c0-7.81-5.21-13.44-11.93-13.44-6.8 0-12.51 5.63-12.51 13.44 0 7.72 5.71 13.44 12.51 13.44 6.72 0 11.93-5.72 11.93-13.44z"/>
        <path fill="#34A853" d="M225 3v65h-9.5V3h9.5z"/>
        <path fill="#EA4335" d="M262.02 54.48l7.56 5.04c-2.44 3.61-8.32 9.83-18.48 9.83-12.6 0-22.01-9.74-22.01-22.18 0-13.19 9.49-22.18 20.92-22.18 11.51 0 17.14 9.16 18.98 14.11l1.01 2.52-29.65 12.28c2.27 4.45 5.8 6.72 10.75 6.72 4.96 0 8.4-2.44 10.92-6.14zm-23.27-7.98l19.82-8.23c-1.09-2.77-4.37-4.7-8.23-4.7-4.95 0-11.84 4.37-11.59 12.93z"/>
        <path fill="#4285F4" d="M35.29 41.41V32H67c.31 1.64.47 3.58.47 5.68 0 7.06-1.93 15.79-8.15 22.01-6.05 6.3-13.78 9.66-24.02 9.66C16.32 69.35.36 53.89.36 34.91.36 15.93 16.32.47 35.3.47c10.5 0 17.98 4.12 23.6 9.49l-6.64 6.64c-4.03-3.78-9.49-6.72-16.96-6.72-13.86 0-24.7 11.17-24.7 25.03 0 13.86 10.84 25.03 24.7 25.03 8.99 0 14.11-3.61 17.39-6.89 2.66-2.66 4.41-6.46 5.1-11.65l-22.5-.02z"/>
      </svg>
    </div>

    <!-- Search Box Form -->
    <form id="search-form" class="search-form" action="https://www.google.com/search" method="GET" target="_blank">
      <div class="search-box">
        <!-- Search Icon -->
        <span class="search-icon">
          <svg focusable="false" viewBox="0 0 24 24" width="20" height="20" fill="#9aa0a6">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
          </svg>
        </span>

        <input 
          type="text" 
          id="search-input" 
          name="q" 
          class="search-input" 
          autocomplete="off" 
          autofocus
          aria-label="Cari" 
          placeholder=""
        >

        <!-- Clear Button (hidden by default) -->
        <button type="button" id="clear-btn" class="icon-btn clear-btn" aria-label="Hapus teks" style="display: none;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#70757a">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path>
          </svg>
        </button>

        <!-- Voice Search Icon -->
        <button type="button" id="voice-btn" class="icon-btn voice-btn" title="Telusuri dengan suara" aria-label="Telusuri dengan suara">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="#4285f4" d="m12 15c1.66 0 3-1.34 3-3v-6c0-1.66-1.34-3-3-3s-3 1.34-3 3v6c0 1.66 1.34 3 3 3z"></path>
            <path fill="#34a853" d="m11 18.08h2v3.92h-2z"></path>
            <path fill="#fbbc05" d="m7.05 16.97-1.41-1.41c-1.04-1.04-1.64-2.45-1.64-3.96h2c0 1.05.42 2.05 1.17 2.8l-.12.57z"></path>
            <path fill="#ea4335" d="m18.36 11.6h2c0 2.22-.89 4.25-2.34 5.71l-1.41-1.41c1.07-1.08 1.75-2.61 1.75-4.3z"></path>
          </svg>
        </button>

        <!-- Google Lens Icon -->
        <button type="button" id="lens-btn" class="icon-btn lens-btn" title="Telusuri lewat gambar" aria-label="Telusuri lewat gambar">
          <svg viewBox="0 0 192 192" width="22" height="22">
            <path fill="#4285F4" d="M78 40a38 38 0 1 0 38 38 38 38 0 0 0-38-38zm0 60a22 22 0 1 1 22-22 22 22 0 0 1-22 22z"/>
            <path fill="#EA4335" d="M142 66a6 6 0 0 0-6 6v14a42 42 0 0 1-42 42H70a6 6 0 0 0 0 12h24a54 54 0 0 0 54-54V72a6 6 0 0 0-6-6z"/>
            <path fill="#FBBC05" d="M50 126a6 6 0 0 0 6-6V96a42 42 0 0 1 42-42h14a6 6 0 0 0 0-12H98a54 54 0 0 0-54 54v24a6 6 0 0 0 6 6z"/>
            <path fill="#34A853" d="M142 36a6 6 0 0 0-6 6 6 6 0 0 1-6 6 6 6 0 0 0 0 12 18 18 0 0 0 18-18 6 6 0 0 0-6-6z"/>
          </svg>
        </button>
      </div>

      <!-- Action Buttons -->
      <div class="search-buttons">
        <button type="submit" id="btn-search" class="btn">Penelusuran Google</button>
        <button type="button" id="btn-lucky" class="btn">Saya Lagi Beruntung</button>
      </div>
    </form>

    <!-- Language Selector -->
    <div class="language-offer">
      <span>Google ditawarkan dalam:</span>
      <a href="#" class="lang-link">English</a>
      <a href="#" class="lang-link">Jawa</a>
      <a href="#" class="lang-link">Balinese</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-top">
      <span>Indonesia</span>
    </div>
    <div class="footer-bottom">
      <div class="footer-left">
        <a href="https://about.google/" target="_blank">Tentang</a>
        <a href="https://ads.google.com/" target="_blank">Periklanan</a>
        <a href="https://www.google.com/services/" target="_blank">Bisnis</a>
        <a href="https://google.com/search/howsearchworks/" target="_blank">Cara kerja Penelusuran</a>
      </div>
      <div class="footer-right">
        <a href="https://policies.google.com/privacy" target="_blank">Privasi</a>
        <a href="https://policies.google.com/terms" target="_blank">Persyaratan</a>
        <a href="#" id="settings-link">Setelan</a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
